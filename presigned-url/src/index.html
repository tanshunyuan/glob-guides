<!doctype html>
<html>
    <head>
        <title>Object Storage Client</title>
    </head>
    <body>
        <form id="object-storage-form">
            <input name="content" type="file" />
            <button type="submit">Submit</button>
        </form>
    </body>
    <script type="module">
        const BASE_URL = "http://localhost:8086";
        const objectStorageForm = document.getElementById(
            "object-storage-form",
        );
        const handleFormSubmit = async (event) => {
            event.preventDefault();
            const formData = new FormData(objectStorageForm);
            const fileContent = formData.get("content");

            const requestBody = {
                name: fileContent.name,
                contentType: fileContent.type,
            };
            console.log("requestBody ==> ", requestBody);
            const response = await fetch(`${BASE_URL}/upload`, {
                headers: {
                    "Content-Type": "application/json",
                },
                method: "POST",
                body: JSON.stringify(requestBody),
            });

            if (!response.ok) {
                throw new Error(
                    `Failed to create signed URL: ${response.status}`,
                );
            }

            const { signedUrl } = await response.json();

            const uploadResponse = await fetch(signedUrl, {
                method: "PUT",
                headers: {
                    "Content-Type": fileContent.type,
                },
                body: fileContent,
            });

            if (!uploadResponse.ok) {
                throw new Error(
                    `Failed to upload file: ${uploadResponse.status}`,
                );
            }

            console.log("Upload complete");
        };

        objectStorageForm.addEventListener("submit", handleFormSubmit);
    </script>
</html>
